server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  application:
    name: CourseCatlogApplication
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  cache:
    type: simple
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

app:
  # JDBC via app.datasource (NOT spring.datasource) so SPRING_DATASOURCE_URL / DB_URL in the environment cannot redirect to localhost.
  datasource:
    # Supabase transaction pooler (port 6543). prepareThreshold=0 avoids prepared-statement issues with PgBouncer.
    url: jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: ${DB_USER:postgres.bbvumiciycehyvkafvmx}
    password: ${DB_PASSWORD:DhinaCSE@2004}
    driver-class-name: org.postgresql.Driver
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    expiration-ms: 86400000
  commerce:
    mock-payments: true
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  content:
    signing-secret: ${CONTENT_SIGNING_SECRET:dev-change-me-signing-key-min-32-bytes!!}
    signed-url-ttl-seconds: 3600
  # Course promo video uploads (Supabase Storage S3-compatible API). Do not commit secrets; use env only.
  # SUPABASE_S3_ACCESS_KEY_ID, SUPABASE_S3_SECRET_ACCESS_KEY, SUPABASE_S3_ENDPOINT, SUPABASE_S3_BUCKET,
  # SUPABASE_STORAGE_PUBLIC_URL_PREFIX (e.g. https://<ref>.supabase.co/storage/v1/object/public/<bucket>)
  supabase-storage:
    enabled: ${SUPABASE_STORAGE_ENABLED:true}
    endpoint: ${SUPABASE_S3_ENDPOINT:https://bbvumiciycehyvkafvmx.storage.supabase.co/storage/v1/s3}
    access-key-id: ${SUPABASE_S3_ACCESS_KEY_ID:2e66c3f8c2ae0f7caadb11b0e99f76c0}
    secret-access-key: ${SUPABASE_S3_SECRET_ACCESS_KEY:f4db66f54f211ab4cb38bebf439e0bdbb019afd61dc5f7705dfd045c62016b65}
    bucket: ${SUPABASE_S3_BUCKET:course-video}
    region: ${SUPABASE_S3_REGION:us-east-1}
    public-url-prefix: ${SUPABASE_STORAGE_PUBLIC_URL_PREFIX:https://bbvumiciycehyvkafvmx.supabase.co/storage/v1/object/public/course-video}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    persistAuthorization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  level:
    com.zaxxer.hikari.HikariConfig: DEBUG